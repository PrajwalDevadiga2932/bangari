<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Memory Camera Studio 📸</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&family=Allura&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f4ece1;
      background-image: 
        radial-gradient(#e2d5c3 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      color: #5c434d;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* Header */
    .hero {
      text-align: center;
      padding: 40px 20px 10px;
    }

    .hero h1 {
      font-family: 'Allura', cursive;
      font-size: 4rem;
      color: #ff4f81;
    }

    .hero p {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: #7d5a67;
    }

    /* Studio Desk Stage */
    .studio-stage {
      max-width: 1000px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Polaroid Camera Graphic */
    .camera-wrapper {
      position: relative;
      width: 280px;
      height: 200px;
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12), inset 0 -8px 0 rgba(0,0,0,0.05);
      border: 4px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .camera-stripe {
      position: absolute;
      top: 35px;
      width: 100%;
      height: 16px;
      background: linear-gradient(90deg, #ff758c, #ffb3c6, #ffd1dc);
    }

    .camera-lens {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #2b2b2b;
      border: 8px solid #e0e0e0;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25), inset 0 0 15px rgba(255,255,255,0.2);
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lens-inner {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(135deg, #111, #444);
      border: 3px solid #666;
    }

    .flash-bulb {
      position: absolute;
      top: 18px;
      right: 25px;
      width: 26px;
      height: 26px;
      background: #fff8dc;
      border: 3px solid #ccc;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    .shutter-btn {
      margin-top: 25px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ff4f81, #ff7eb3);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 79, 129, 0.35);
      transition: all 0.2s ease;
      z-index: 20;
    }

    .shutter-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 14px 30px rgba(255, 79, 129, 0.45);
    }

    .shutter-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Ejected Photos Workspace */
    .photo-desk {
      width: 100%;
      min-height: 450px;
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 20px;
      position: relative;
    }

    /* Printed Polaroid Card */
    .printed-card {
      width: 260px;
      background: #ffffff;
      padding: 14px 14px 20px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      transform: scale(0) translateY(-100px);
      opacity: 0;
      animation: ejectPhoto 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
      position: relative;
      cursor: grab;
    }

    @keyframes ejectPhoto {
      0% {
        transform: scale(0.3) translateY(-180px);
        opacity: 0;
      }
      60% {
        transform: scale(1.05) translateY(10px);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0) rotate(var(--random-rotate));
        opacity: 1;
      }
    }

    .printed-photo-frame {
      width: 100%;
      height: 200px;
      border-radius: 6px;
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .printed-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(80%) contrast(120%);
      transition: filter 3.5s ease-in-out;
    }

    /* Slow developing photo effect */
    .printed-card.developed .printed-photo-frame img {
      filter: grayscale(0%) contrast(100%);
    }

    .card-title {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ff4f81;
      text-align: center;
      margin-top: 10px;
    }

    .card-note {
      font-family: 'Caveat', cursive;
      font-size: 1.2rem;
      color: #6e4d58;
      text-align: center;
      margin-top: 4px;
      line-height: 1.2;
    }

    /* Flash Overlay Animation */
    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }

    .flash-active {
      animation: cameraFlash 0.4s ease-out;
    }

    @keyframes cameraFlash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Bottom Nav */
    .nav-container {
      text-align: center;
      margin-top: 40px;
    }

    .nav-btn {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 50px;
      background: #fff;
      color: #ff4f81;
      border: 2px solid #ffb3c6;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      background: #ffe3ec;
    }
  </style>
</head>
<body>

  <div class="flash-overlay" id="flash"></div>

  <section class="hero">
    <h1>The Memory Camera 📸</h1>
    <p>Press the shutter button to print out your custom awards!</p>
  </section>

  <section class="studio-stage">
    
    <!-- Camera Graphic -->
    <div class="camera-wrapper">
      <div class="flash-bulb"></div>
      <div class="camera-stripe"></div>
      <div class="camera-lens">
        <div class="lens-inner"></div>
      </div>
    </div>

    <!-- Shutter Button -->
    <button class="shutter-btn" id="printBtn" onclick="snapPhoto()">📸 Print Next Award</button>

    <!-- Photo Desk Wall -->
    <div class="photo-desk" id="desk"></div>

  </section>

  <div class="nav-container">
    <a href="memory4.html" class="nav-btn">⏪ If i'm your papada bale, click on continue</a>
  </div>

  <script>
    // List of Award Cards to "Print"
    const awardsData = [
      {
        title: "🥇 Best Smile 2026",
        note: "For a smile that brightens up the room instantly!",
        img: "images/award1.jpg"
      },
      {
        title: "👑 CEO of Chaos & Giggles",
        note: "For creating spontaneous laughter & fun madness!",
        img: "images/award2.jpg"
      },
      {
        title: "💖 Golden Heart Award",
        note: "For being one of the kindest & most caring souls.",
        img: "images/award3.jpg"
      }
    ];

    let currentIndex = 0;

    function snapPhoto() {
      if (currentIndex >= awardsData.length) {
        alert("All awards have been printed! 🎉");
        return;
      }

      // Trigger Screen Flash
      const flash = document.getElementById('flash');
      flash.classList.add('flash-active');
      setTimeout(() => flash.classList.remove('flash-active'), 400);

      // Pop Confetti
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 30,
          spread: 50,
          origin: { y: 0.4 }
        });
      }

      // Create Printed Polaroid Card
      const data = awardsData[currentIndex];
      const card = document.createElement('div');
      card.className = 'printed-card';

      // Random Slight Tilt for Scrapbook Vibe (-6deg to +6deg)
      const randomRot = (Math.random() * 12 - 6).toFixed(1) + 'deg';
      card.style.setProperty('--random-rotate', randomRot);

      card.innerHTML = `
        <div class="printed-photo-frame">
          <img src="${data.img}" alt="${data.title}">
        </div>
        <div class="card-title">${data.title}</div>
        <div class="card-note">"${data.note}"</div>
      `;

      const desk = document.getElementById('desk');
      desk.prepend(card);

      // Trigger Developing Photo Effect (Gradual Color Fade-in)
      setTimeout(() => {
        card.classList.add('developed');
      }, 300);

      currentIndex++;

      // Update Button Label
      const btn = document.getElementById('printBtn');
      if (currentIndex >= awardsData.length) {
        btn.innerText = "✨ All Awards Printed!";
        btn.style.opacity = "0.7";
      } else {
        btn.innerText = `📸 Print Award (${currentIndex + 1}/${awardsData.length})`;
      }
    }
  </script>
</body>
