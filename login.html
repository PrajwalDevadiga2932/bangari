<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Entry</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(-45deg,#12002f,#2b1055,#5f0a87,#ff0080);
      background-size:400% 400%;
      animation:bgMove 10s ease infinite;
      position:relative;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* Floating Hearts */
    .heart{
      position:absolute;
      font-size:24px;
      opacity:.6;
      animation:float 10s linear infinite;
    }

    .heart:nth-child(1){left:10%;top:95%;}
    .heart:nth-child(2){left:30%;top:100%;animation-duration:8s;}
    .heart:nth-child(3){left:65%;top:98%;animation-duration:12s;}
    .heart:nth-child(4){left:85%;top:100%;animation-duration:9s;}

    @keyframes float{
      from{
        transform:translateY(0) scale(.8);
        opacity:.6;
      }
      to{
        transform:translateY(-120vh) scale(1.4);
        opacity:0;
      }
    }

    /* Main Card */
    .container{
      width:90%;
      max-width:560px;
      padding:45px 35px;
      text-align:center;
      border-radius:32px;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,192,203,.45);
      box-shadow:0 10px 35px rgba(255,182,193,.35);
      animation:fadeIn 1.2s ease;
      position:relative;
      z-index:2;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px) scale(.92);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    h1{
      font-family:'Pacifico',cursive;
      font-size:2.7rem;
      color:#ff5c8a;
      margin-bottom:12px;
      text-shadow:0 2px 8px rgba(255,105,135,.25);
    }

    p{
      color:#6f5560;
      font-size:1.05rem;
      line-height:1.8;
      margin-bottom:25px;
    }

    .hint{
      background:#fff4f8;
      border:1px dashed #ffb3c7;
      color:#b15b76;
      padding:12px 16px;
      border-radius:16px;
      font-size:.95rem;
      margin-bottom:22px;
    }

    .input-box{
      margin:14px 0;
    }

    input{
      width:100%;
      padding:16px 18px;
      border:none;
      border-radius:18px;
      outline:none;
      font-size:1rem;
      color:#5c4b52;
      background:#fff7fa;
      border:1px solid #ffd1dc;
      transition:.3s ease;
      text-transform:uppercase;
    }

    input::placeholder{
      color:#c48aa0;
      text-transform:none;
    }

    input:focus{
      background:#ffffff;
      border-color:#ff9fbd;
      box-shadow:0 0 12px rgba(255,159,189,.35);
      transform:scale(1.02);
    }

    .btn{
      margin-top:22px;
      width:100%;
      padding:16px;
      border:none;
      border-radius:50px;
      font-size:1.08rem;
      font-weight:700;
      color:#fff;
      cursor:pointer;
      background:linear-gradient(135deg,#ff8fb1,#ffb3c7);
      box-shadow:0 8px 20px rgba(255,143,177,.35);
      transition:all .35s ease;
    }

    .btn:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 12px 28px rgba(255,143,177,.45);
    }

    @media(max-width:600px){
      h1{
        font-size:2.2rem;
      }

      .container{
        padding:35px 22px;
      }
    }
  </style>
</head>
<body>

  <div class="heart">💖</div>
  <div class="heart">💕</div>
  <div class="heart">💗</div>
  <div class="heart">💞</div>

  <div class="container">

    <h1>Secret Entry 💖</h1>

    <p>
      Only someone very special can unlock the next surprise ✨<br>
      Lets confirm who this is first 💕
    </p>

    <div class="input-box">
      <input type="text"
             id="name"
             placeholder="Enter your name 💖"
             oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="input-box">
      <input type="text"
             id="pass1"
             placeholder="Password Box 1 🔐"
             oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="input-box">
      <input type="text"
             id="pass2"
             placeholder="Password Box 2 🔐"
             oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="hint">
      💡 <strong>Password Hint:</strong>
      Enter the names of things I admire most in you
      (<strong>CH....</strong> and <strong>MI....</strong>) ✨
    </div>

    <button class="btn" onclick="checkPassword()">
      Unlock the Surprise ✨
    </button>

  </div>

  <script>
    function checkPassword(){

      const name = document.getElementById('name').value.trim();
      const pass1 = document.getElementById('pass1').value.trim();
      const pass2 = document.getElementById('pass2').value.trim();

      if(name === '' || pass1 === '' || pass2 === ''){
        alert('Please fill all the boxes 💕');
        return;
      }

      // Save the name for next pages
      localStorage.setItem('realName', name);

      // Secret passwords
      const correct1 = 'CHINNI';
      const correct2 = 'MINNI';

      if(pass1 === correct1 && pass2 === correct2){

        // Save nickname too
        localStorage.setItem('nickName', correct1);

        // Go to next page
        window.location.href = 'memory1.html';

      }else{

        alert('Oops 😅 Those secret words are not correct. Try thinking about what I admire most in you 💖');

      }
    }
  </script>

</body>
</html>
